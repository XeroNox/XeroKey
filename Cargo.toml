[package]
name = "xerokey"
version = "1.0.0"
edition = "2024"

[dependencies]
zip = { version = "2.3", features = ["aes-crypto"] }
rayon = "1.10"
memmap2 = "0.9"
colored = "2.1"
indicatif = "0.17"
crc32fast = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

